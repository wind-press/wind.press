        name: Angel Julian Mena
        description: Desarrollo de soluciones abiertas SL
        avatar:
          src: https://s.gravatar.com/avatar/862747ad39a43ba17370e55e9532986b?s=100
    - quote_title: Not a glorified font manager
      quote: "Yabe font is not a glorified google font manager. At least that is what I thought it was. With google fonts, when it comes to performance, one would assume that since most fonts are hosted by google everything is optimized and cached. But Google Fonts delivers optimized fonts based on device/browser. Fonts are always downloaded after your css file has been loaded to the client. This creates unnecessary requests to google. And since you are using google it means you have to abide by their privacy policy and we all know that those are horrible. Google fonts are only cached for 1 day. meaning your clients needs to download fonts over and over. But with the help of Yabe fonts I do not have to worry about that because it takes care of that and I do not even need to know how it is done. And to top it all. I can configure the font visually without even knowing all the css tricks."
      author:
        name: John Stewart
        description: Developer
        avatar:
          src: https://s.gravatar.com/avatar/530df329bffdb78e680059c84d21a1d3?s=100
