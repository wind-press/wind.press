features:
  title: Beyond the basics
  description: Advanced features that give you complete control over your fonts and typography.
  items:
    - title: Custom fonts upload
      description: Upload your own font files via the WordPress media uploader. No FTP or coding required.
      icon: fa6-solid:cloud-arrow-up
    - title: CSS custom properties
      description: "Every font gets a CSS variable automatically: --ywf--family-{slug}. Use in themes and custom CSS."
      icon: fa6-solid:code
    - title: Font preloading
      description: Critical fonts are preloaded in the HTML head for faster rendering and reduced layout shift.
      icon: fa6-solid:bolt
    - title: Subset selection
      description: Choose specific glyph subsets (latin, cyrillic, etc.) when importing Google Fonts to reduce file size.
      icon: fa6-solid:text-slash
    - title: No-plugin mode
      description: Fonts keep working even after disabling the plugin. Load cached fonts via a PHP snippet.
      icon: fa6-solid:power-off
    - title: Browser font converter
      description: Convert TTF to WOFF2 and back, entirely in your browser via WebAssembly. No uploads, fully private.
      icon: fa6-solid:wand-magic-sparkles

